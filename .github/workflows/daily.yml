name: Tägliches TikTok-Video

on:
  schedule:
    # GitHub startet geplante Läufe oft Stunden zu spät. Darum mehrere Startzeiten:
    # Der erste Lauf, der wirklich startet, macht das Video; die anderen merken das und hören sofort auf.
    - cron: "17 0 * * *"   # 02:17 deutsche Sommerzeit
    - cron: "17 2 * * *"   # 04:17
    - cron: "17 3 * * *"   # 05:17
    - cron: "47 3 * * *"   # 05:47
  workflow_dispatch: {}    # "Run workflow"-Knopf zum Testen

permissions:
  contents: write

concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Schon ein Video für heute?
        id: check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && grep -q "\"date\": \"$(date -u +%F)\"" data/history.json; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Übersprungen::Für heute gibt es schon ein Video."
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Werkzeuge installieren
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q -r requirements.txt

      - name: Video erstellen und hochladen
        if: steps.check.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NICHE: ${{ vars.NICHE }}
          CONTENT_MODE: ${{ vars.CONTENT_MODE }}
          LANGUAGE: ${{ vars.LANGUAGE }}
          TRENDS_GEO: ${{ vars.TRENDS_GEO }}
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER }}
        run: python main.py

      - name: Video zum Download bereitstellen
        if: always() && steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: output/
          retention-days: 14

      - name: Themen-Verlauf speichern
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add data/history.json
          git commit -m "Verlauf aktualisiert" || echo "nichts zu speichern"
          git push
