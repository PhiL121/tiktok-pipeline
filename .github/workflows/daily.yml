name: Tägliches TikTok-Video

on:
  schedule:
    - cron: "0 5 * * *"   # jeden Tag 05:00 UTC = 7:00 Uhr deutsche Sommerzeit
  workflow_dispatch: {}    # "Run workflow"-Knopf zum Testen

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Werkzeuge installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q -r requirements.txt

      - name: Video erstellen und hochladen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NICHE: ${{ vars.NICHE }}
          CONTENT_MODE: ${{ vars.CONTENT_MODE }}
          LANGUAGE: ${{ vars.LANGUAGE }}
          TRENDS_GEO: ${{ vars.TRENDS_GEO }}
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER }}
        run: python main.py

      - name: Video zum Download bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: output/
          retention-days: 14

      - name: Themen-Verlauf speichern
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add data/history.json
          git commit -m "Verlauf aktualisiert" || echo "nichts zu speichern"
          git push
