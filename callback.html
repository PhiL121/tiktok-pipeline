<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikTok Login</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px}code{display:block;word-break:break-all;background:#eee;padding:12px;border-radius:8px}</style>
</head><body>
<h1>TikTok-Login</h1>
<p id="msg">Kopiere diesen Code. Geh dann in GitHub auf <b>Actions &gt; TikTok verbinden &gt; Run workflow</b> und füge ihn dort ein. Der Code gilt nur wenige Minuten.</p>
<code id="code"></code>
<script>
const p = new URLSearchParams(location.search);
document.getElementById("code").textContent = p.get("code") || ("Kein Code: " + (p.get("error_description") || p.get("error") || "unbekannt"));
</script>
</body></html>
